
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SDZO Cyber Hub</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🌧️ FONDO MATRIX -->
<canvas id="matrix" aria-hidden="true"></canvas>

<!-- 📌 MENÚ LATERAL -->
<div class="sidebar">

<h2>SDZO SYSTEM</h2>

<!-- 🎥 VIDEO LATERAL -->
<video id="sidebarVideo" autoplay muted loop playsinline>
  <source src="fondo_final.mp4" type="video/mp4">
</video>

<a href="#">Inicio</a>

<!-- 🔗 MENÚ DE ENLACES -->
<a href="#" id="linksToggle"
   aria-expanded="false"
   aria-controls="linksMenu">
   🔗 Links ▼
</a>

<!-- 🔐 CARPETAS PROTEGIDAS -->
<div id="linksMenu" hidden>

  <button class="folder" data-folder="programas1">
    📁 Programas 1 🔒
  </button>

  <button class="folder" data-folder="programas2">
    📁 Programas 2 🔒
  </button>

</div>

<a href="#">Contenido</a>
<a href="#">Noticias</a>
<a href="#">Contacto</a>

</div>

<!-- 📊 CONTENIDO PRINCIPAL -->
<div class="main">

<div class="header">

<h1 class="glow">
DASHBOARD CYBER 2026
</h1>

<button id="refreshNews">
Actualizar noticias
</button>

</div>

<p>Noticias reales de ciberseguridad en tiempo real.</p>

<!-- 🌐 REDES SOCIALES -->
<div class="grid">

<a class="card"
   href="https://wa.me/51999999999"
   target="_blank"
   rel="noopener noreferrer">WhatsApp</a>

<a class="card"
   href="https://instagram.com"
   target="_blank"
   rel="noopener noreferrer">Instagram</a>

<a class="card"
   href="https://tiktok.com"
   target="_blank"
   rel="noopener noreferrer">TikTok</a>

<a class="card"
   href="https://youtube.com"
   target="_blank"
   rel="noopener noreferrer">YouTube</a>

</div>

<!-- 📰 NOTICIAS -->
<div class="news">

<h3>🧠 Noticias de Ciberseguridad (LIVE)</h3>

<div id="newsBox">
Cargando noticias...
</div>

</div>

</div>

<!-- 🔐 VENTANA DE ACCESO RESTRINGIDO -->
<dialog id="accessDialog" aria-labelledby="accessTitle">

<form id="accessForm">

<h2 id="accessTitle">
🔐 ACCESO RESTRINGIDO
</h2>

<p id="folderName"></p>

<!-- Compatibilidad con gestores de contraseñas -->
<input type="text"
       name="username"
       value="SDZO SYSTEM"
       autocomplete="username"
       class="sr-only"
       tabindex="-1"
       aria-label="Usuario"
       readonly>

<label for="password">
Contraseña de seguridad
</label>

<input id="password"
       name="password"
       type="password"
       autocomplete="current-password"
       required
       autofocus>

<label class="show">
  <input type="checkbox" id="showPassword">
  Mostrar contraseña
</label>

<p id="accessStatus" role="status" aria-live="polite"></p>

<div class="actions">

<button id="unlock" type="submit">
DESBLOQUEAR
</button>

<button id="cancel" type="button">
Cancelar
</button>

</div>

</form>

</dialog>

<!-- ⚙️ JAVASCRIPT -->
<script src="app.js"></script>

</body>
</html>
